name: Action tests
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_BUILD) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm test
  main-alert:
    needs: [test]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      issues: write
    uses: Arconath/.github/.github/workflows/ci-main-alert.yml@49a0a4077b7385a5ce326a86fc4d203e453115f9
    with:
      runs-on: ${{ vars.RUNNER_LIGHT || '["arconath-ci"]' }}
      failed: ${{ contains(needs.*.result, 'failure') }}
